# Builds and tests the client, the speed-test kit (bench/), the local API (localapi/), the MCP server (mcp/) and the
# command-line tool (cli/) on every pull request and on main, with the Go toolchain go.mod names (fetched and checked
# against Go's checksum database). Nothing here publishes: a release is a v* tag, which only admins can push.
name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: go vet and go test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: go vet and go test
        env:
          GOTOOLCHAIN: auto
          GOFLAGS: -mod=readonly
        run: |
          set -eu
          go version
          go vet ./...
          go test -count=1 ./...

      # The speed-test kit is its own module in bench/ (github.com/survivalservers/studio-go/bench), so the root's ./...
      # leaves it out: vetted and tested here too.
      - name: go vet and go test (bench/)
        working-directory: bench
        env:
          GOTOOLCHAIN: auto
          GOFLAGS: -mod=readonly
        run: |
          set -eu
          go vet ./...
          go test -count=1 ./...

      # The local API is its own module in localapi/ (github.com/survivalservers/studio-go/localapi), so the root's
      # ./... leaves it out: vetted and tested here too.
      - name: go vet and go test (localapi/)
        working-directory: localapi
        env:
          GOTOOLCHAIN: auto
          GOFLAGS: -mod=readonly
        run: |
          set -eu
          go vet ./...
          go test -count=1 ./...

      # The MCP server is its own module in mcp/ (github.com/survivalservers/studio-go/mcp), so the root's ./... leaves
      # it out: vetted and tested here too.
      - name: go vet and go test (mcp/)
        working-directory: mcp
        env:
          GOTOOLCHAIN: auto
          GOFLAGS: -mod=readonly
        run: |
          set -eu
          go vet ./...
          go test -count=1 ./...

      # The command-line tool is its own module in cli/ (github.com/survivalservers/studio-go/cli), so the root's
      # ./... leaves it out: vetted and tested here too.
      - name: go vet and go test (cli/)
        working-directory: cli
        env:
          GOTOOLCHAIN: auto
          GOFLAGS: -mod=readonly
        run: |
          set -eu
          go vet ./...
          go test -count=1 ./...
